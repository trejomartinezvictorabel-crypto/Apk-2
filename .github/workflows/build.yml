      - name: 5e. Asegurar void main() en lib/main.dart con Python
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re

          main_path = 'lib/main.dart'
          if os.path.exists(main_path):
              with open(main_path, 'r', encoding='utf-8', errors='replace') as f:
                  code = f.read()

              tiene_main = re.search(
                  r'(?m)^[ \t]*(?:Future<[^>]+>\s+|void\s+)?main\s*\([^)]*\)\s*(?:async\s*)?\{',
                  code,
              )

              if tiene_main:
                  print('lib/main.dart ya tiene declaracion main() valida.')
              else:
                  m = re.search(
                      r'class\s+([A-Za-z_][A-Za-z0-9_]*)\s+extends\s+(?:StatelessWidget|StatefulWidget)',
                      code,
                  )
                  if m:
                      widget_name = m.group(1)
                      bloque_main = (
                          '\n\nvoid main() {\n'
                          '  WidgetsFlutterBinding.ensureInitialized();\n'
                          f'  runApp(const {widget_name}());\n'
                          '}\n'
                      )
                  else:
                      bloque_main = (
                          '\n\nvoid main() {\n'
                          '  WidgetsFlutterBinding.ensureInitialized();\n'
                          '  runApp(\n'
                          '    const MaterialApp(\n'
                          '      debugShowCheckedModeBanner: false,\n'
                          '      home: Scaffold(\n'
                          '        body: Center(child: Text(\'Navegación Offline\')),\n'
                          '      ),\n'
                          '    ),\n'
                          '  );\n'
                          '}\n'
                      )

                  if 'package:flutter/material.dart' not in code:
                      code = "import 'package:flutter/material.dart';\n" + code

                  code = code + bloque_main
                  with open(main_path, 'w', encoding='utf-8') as f:
                      f.write(code)
                  print('Se inyecto void main() en lib/main.dart.')

              print('--- Ultimas lineas de lib/main.dart ---')
              for idx, line in enumerate(code.splitlines()[-12:], start=max(1, len(code.splitlines()) - 11)):
                  print(f'{idx}: {line}')
          PY
