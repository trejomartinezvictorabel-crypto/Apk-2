name: Build APK desde ZIP

on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar y descomprimir el ZIP (plano o con carpeta raíz)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No hay ningún .zip en la raíz del repositorio"; exit 1; }
          best=""; bt=-1
          for f in "${zips[@]}"; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$bt" ]; then bt=$t; best=$f; fi
          done
          echo "ZIP elegido: $best"
          rm -rf _unzip project
          mkdir -p _unzip
          unzip -q -o "$best" -d _unzip
          find _unzip -name '__MACOSX' -prune -exec rm -rf {} + || true
          find _unzip -name '.DS_Store' -delete || true
          # Raíz = carpeta más superficial que contiene settings.gradle
          root=""
          cand=$(find _unzip -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$cand" ]; then root=$(dirname "$cand"); fi
          if [ -z "$root" ]; then
            root=_unzip
            while [ "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$root" -mindepth 1 -maxdepth 1)" ]; do
              root=$(find "$root" -mindepth 1 -maxdepth 1)
            done
          fi
          if [ "$root" = "_unzip" ]; then mv _unzip project; else mv "$root" project; fi
          echo "Raíz del proyecto: ${root#_unzip}"
          ls -la project

      - name: Validar proyecto (archivos, sintaxis, dependencias públicas, prueba del motor)
        shell: bash
        run: |
          set -euo pipefail
          [ -f project/tools/validate_project.py ] || { echo "::error::Falta tools/validate_project.py dentro del ZIP"; exit 1; }
          python3 project/tools/validate_project.py project --red | tee reporte_antes.txt

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Reparar Android SDK, Gradle, AGP y permisos con Python
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, shutil, subprocess

          sdk_root = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
          os.makedirs(sdk_root, exist_ok=True)

          # Reparar cmdline-tools/latest si existe otra subcarpeta
          cmdline_root = os.path.join(sdk_root, "cmdline-tools")
          latest_dir = os.path.join(cmdline_root, "latest")
          if not os.path.exists(latest_dir) and os.path.isdir(cmdline_root):
              subdirs = sorted(
                  [os.path.join(cmdline_root, d) for d in os.listdir(cmdline_root) if os.path.isdir(os.path.join(cmdline_root, d))]
              )
              if subdirs:
                  os.symlink(subdirs[-1], latest_dir)

          sdkmanager = next(
              (p for p in [os.path.join(latest_dir, "bin", "sdkmanager"), shutil.which("sdkmanager")] if p and os.path.isfile(p)),
              None,
          )
          if sdkmanager:
              os.chmod(sdkmanager, 0o755)
              subprocess.run(
                  [sdkmanager, f"--sdk_root={sdk_root}", "--licenses"],
                  input="y\n" * 25,
                  text=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=120,
                  check=False,
              )
              needed = []
              if not os.path.isdir(os.path.join(sdk_root, "platforms", "android-36")):
                  needed.append("platforms;android-36")
              if not os.path.isdir(os.path.join(sdk_root, "build-tools", "36.0.0")):
                  needed.append("build-tools;36.0.0")
              if needed:
                  subprocess.run(
                      [sdkmanager, f"--sdk_root={sdk_root}", *needed],
                      input="y\n" * 25,
                      text=True,
                      timeout=300,
                      check=False,
                  )

          # Actualizar Gradle Wrapper si existe dentro de project/
          wrapper_path = "project/gradle/wrapper/gradle-wrapper.properties"
          if os.path.isfile(wrapper_path):
              txt = open(wrapper_path, encoding="utf-8").read()
              if "distributionUrl=" in txt:
                  prefix = txt.split("distributionUrl=")[0]
                  new_txt = prefix + "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip\n"
                  open(wrapper_path, "w", encoding="utf-8").write(new_txt)

          # Actualizar AGP a 8.3.2 y Kotlin a 2.1.0 si aplica en project/
          for path in [
              "project/settings.gradle",
              "project/settings.gradle.kts",
              "project/build.gradle",
              "project/build.gradle.kts",
          ]:
              if not os.path.isfile(path):
                  continue
              txt = open(path, encoding="utf-8").read()
              new_txt = re.sub(r'(com\.android\.application["\']?\s*(?:version\s*["\']|:))\d+\.\d+\.\d+', r'\g<1>8.3.2', txt)
              new_txt = re.sub(r'(com\.android\.tools\.build:gradle:)\d+\.\d+\.\d+', r'\g<1>8.3.2', new_txt)
              new_txt = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\s*(?:version\s*["\']|:))\d+\.\d+\.\d+', r'\g<1>2.1.0', new_txt)
              if new_txt != txt:
                  open(path, "w", encoding="utf-8").write(new_txt)
                  print("Actualizado:", path)

          # Asegurar SDK 36 y minSdk 24 en project/app/build.gradle
          app_gradle = "project/app/build.gradle"
          if os.path.isfile(app_gradle):
              lines = open(app_gradle, encoding="utf-8").readlines()
              out_lines = []
              for line in lines:
                  if "compileSdkVersion" in line or "compileSdk " in line:
                      out_lines.append("    compileSdk 36\n")
                  elif "targetSdkVersion" in line or "targetSdk " in line:
                      out_lines.append("        targetSdk 36\n")
                  elif "minSdkVersion" in line or "minSdk " in line:
                      out_lines.append("        minSdk 24\n")
                  else:
                      out_lines.append(line)
              open(app_gradle, "w", encoding="utf-8").writelines(out_lines)

          # Agregar permisos base y de audio/almacenamiento/red si faltan en AndroidManifest.xml
          manifest_path = "project/app/src/main/AndroidManifest.xml"
          if os.path.isfile(manifest_path):
              manifest = open(manifest_path, encoding="utf-8").read()
              perms = [
                  '<uses-permission android:name="android.permission.INTERNET"/>',
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
                  '<uses-permission android:name="android.permission.WAKE_LOCK"/>',
                  '<uses-permission android:name="android.permission.VIBRATE"/>',
                  '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>',
              ]
              missing_perms = [p for p in perms if p.split('"')[1] not in manifest]
              if missing_perms and "<application" in manifest:
                  manifest = manifest.replace("<application", "\n    " + "\n    ".join(missing_perms) + "\n\n    <application", 1)
                  open(manifest_path, "w", encoding="utf-8").write(manifest)
                  print("Permisos actualizados en AndroidManifest.xml")
          PY

      - name: Plataforma 36
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          [ -d "$ANDROID_HOME/platforms/android-36" ] || sdkmanager "platforms;android-36"
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || sdkmanager "build-tools;36.0.0"

      - name: Clave de firma (debug) para el APK release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess

          os.makedirs(os.path.expanduser("~/.android"), exist_ok=True)
          ks_path = os.path.expanduser("~/.android/debug.keystore")
          if not os.path.isfile(ks_path):
              subprocess.run(
                  [
                      "keytool", "-genkey", "-v", "-keystore", ks_path,
                      "-storepass", "android", "-alias", "androiddebugkey",
                      "-keypass", "android", "-keyalg", "RSA", "-keysize", "2048",
                      "-validity", "10000", "-dname", "CN=Android Debug,O=Android,C=US",
                  ],
                  check=True,
              )

          # Si el ZIP incluye firma fija ci-keystore.p12, conectarla en app/build.gradle
          p12_path = "project/app/ci-keystore.p12"
          app_gradle = "project/app/build.gradle"
          if os.path.isfile(p12_path) and os.path.isfile(app_gradle):
              txt = open(app_gradle, encoding="utf-8").read()
              if "ci-keystore.p12" not in txt:
                  bloque = (
                      "android {\n"
                      "    signingConfigs {\n"
                      "        debug {\n"
                      "            storeFile file('ci-keystore.p12')\n"
                      "            storePassword 'android'\n"
                      "            keyAlias 'navegacion'\n"
                      "            keyPassword 'android'\n"
                      "            storeType 'pkcs12'\n"
                      "        }\n"
                      "    }\n"
                  )
                  nuevo, n = re.subn(r'^android\s*\{\s*\n', bloque, txt, count=1, flags=re.M)
                  if n == 1:
                      open(app_gradle, "w", encoding="utf-8").write(nuevo)
                      print("Firma fija ci-keystore.p12 aplicada.")
          PY

      - name: Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validar entorno (Java 17, Gradle, SDK 36, build-tools)
        shell: bash
        run: python3 project/tools/validate_project.py project --entorno

      - name: Compilar APK release
        run: gradle --no-daemon -p project assembleRelease

      - name: Resumen del APK
        shell: bash
        run: |
          {
            echo "### APK generado"
            echo '```'
            ls -lh project/app/build/outputs/apk/release/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: simulador3d-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir reportes de validación
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-validacion
          path: reporte_*.txt
